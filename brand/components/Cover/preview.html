<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomi</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .star { fill:var(--star); }
  .brand { fill:var(--brand); }
  .sky { fill:var(--sky); }
  .tint { fill:var(--brand-soft); }
  .blk { rx:var(--radius-lg); }
  .orbit { fill:none; stroke:var(--lavender); stroke-width:3; }
  .electron { fill:var(--star); }
  .dust { fill:var(--ink-muted); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:112px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      star 160×200 bled off the top (the primary button colour, largest) · brand 144×168 · sky 136×96 bled off the right · brand-soft 136×112 tint — ≈30% of 960×288
  arrangement one tall star slab with satellites stepping down to the right, bottoms on one line space-5 above the edge, space-4 gutters
  pattern     a literal motif, atom orbits ("Atomi is a small, round atom creature"): two lavender orbit ellipses crossing the blocks, five star-yellow electron discs riding them, a sprinkle of ink-muted star dust on the night ground
  scales      sides in space-2 multiples; gutters space-4; corners radius-lg; electrons r = space-1 + 2, dust r = 2
-->
<rect class="star blk" x="24" y="-24" width="160" height="240" rx="20"/>
<rect class="brand blk" x="200" y="96" width="144" height="168" rx="20"/>
<rect class="sky blk" x="360" y="40" width="136" height="96" rx="20"/>
<rect class="tint blk" x="360" y="152" width="136" height="112" rx="20"/>
<ellipse class="orbit" cx="248" cy="150" rx="236" ry="58" transform="rotate(-16 248 150)"/>
<ellipse class="orbit" cx="248" cy="150" rx="236" ry="58" transform="rotate(20 248 150)"/>
<circle class="electron" cx="30" cy="212" r="6"/>
<circle class="electron" cx="470" cy="88" r="6"/>
<circle class="electron" cx="132" cy="64" r="6"/>
<circle class="electron" cx="400" cy="246" r="6"/>
<circle class="electron" cx="290" cy="40" r="6"/>
<circle class="dust" cx="214" cy="24" r="2"/>
<circle class="dust" cx="250" cy="70" r="2"/>
<circle class="dust" cx="330" cy="18" r="2"/>
<circle class="dust" cx="12" cy="250" r="2"/>
<circle class="dust" cx="182" cy="276" r="2"/>
<circle class="dust" cx="452" cy="14" r="2"/>
<circle class="dust" cx="360" cy="276" r="2"/>
<circle class="dust" cx="104" cy="248" r="2"/>
</svg>
</div>
<div class="words">
<h1 class="name">Atomi</h1>
<p class="tag">Study more, grow brighter.</p>
</div>
</div>
</body>
</html>
