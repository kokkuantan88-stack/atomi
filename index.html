<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomi Science Quiz</title>
<meta name="description" content="Learn secondary science with Atomi: lessons, quizzes, games and battles with friends.">
<meta name="theme-color" content="#231d47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atomi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Atomi brand kit, Pastel cosmic: dusky lavender night sky, pastel purple, butter-star yellow, candy subject colours.
     Cosmic is the default theme; Daylight via data-theme="light".
     Layout: one centred column (max 880px): top bar, then the current view. Subject colours carry meaning everywhere. */
  --bg:#231d47; --surface:#2d2659; --panel:#383069; --ink:#f8f4ff; --muted:#cbc2ea; --line:#4a4084;
  --accent:#cdb6ff; --accent-soft:#3f3478; --accent-ink:#231d47;
  --star:#ffe490; --on-star:#231d47; --star-deep:#ffcf4d;
  --phy:#9fdcff; --chem:#ffb4ab; --bio:#bdf0a0; --prac:#ffe490;
  --phy-soft:#24395e; --chem-soft:#43284a; --bio-soft:#26404a; --prac-soft:#41385a;
  --good:#a6efc4; --good-soft:#22404a; --bad:#ffb3c1; --bad-soft:#45274d;
  --glow:0 0 0 2px #4a4084, 0 0 28px rgba(205,182,255,.4);
  --font-display:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --radius:20px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f8f4ff; --surface:#ffffff; --panel:#efe8ff; --ink:#2a2350; --muted:#5c537f; --line:#ddd2fb;
  --accent:#7445d6; --accent-soft:#ece3ff; --accent-ink:#ffffff;
  --star:#ffe07a; --on-star:#2a2350; --star-deep:#f2b632;
  --phy:#0b6a9e; --chem:#b8402c; --bio:#3b7313; --prac:#7d5a00;
  --phy-soft:#e3f4ff; --chem-soft:#ffece8; --bio-soft:#eefbe2; --prac-soft:#fff6d6;
  --good:#1f6e3a; --good-soft:#e3f6ea; --bad:#b02a4a; --bad-soft:#ffe8ee;
  --glow:0 0 0 2px #ffffff, 0 6px 18px rgba(116,69,214,.2);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--font-display);font-size:1.3rem;font-weight:700;letter-spacing:.2px}
.nav{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:800;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--star);border-color:var(--star-deep);color:var(--on-star)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-big{padding:14px 20px;font-size:1.05rem;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem;background:var(--accent-soft);color:var(--accent)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.s-phy{--c:var(--phy);--cs:var(--phy-soft)} .s-chem{--c:var(--chem);--cs:var(--chem-soft)}
.s-bio{--c:var(--bio);--cs:var(--bio-soft)} .s-prac{--c:var(--prac);--cs:var(--prac-soft)}
.subj{border-top:5px solid var(--c);display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.subj:hover{border-color:var(--c)}
.subj .bar > i,.trow .bar > i{background:var(--c)}
.subj .pct{font-family:var(--font-display);font-size:1.6rem;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.tag{font-size:.75rem;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent))}
/* Home hero */
.hero{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .row{justify-content:center}}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;position:relative}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.9rem;display:flex;gap:6px;align-items:baseline}
.chip b{font-family:var(--font-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.chip.done{border-color:var(--good);background:var(--good-soft);color:var(--good)}
/* Topic rows */
.trow{display:grid;grid-template-columns:1fr 130px auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow.off{opacity:.55}
@media (max-width:560px){.trow{grid-template-columns:1fr auto}.trow .barcell{grid-column:1 / -1;order:3}}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
/* Quiz */
.qtext{font-size:1.2rem;font-weight:700;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
.feedback{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.feedback.good{background:var(--good-soft)} .feedback.bad{background:var(--bad-soft)}
.feedback h3{color:var(--good)} .feedback.bad h3{color:var(--bad)}
.quizhead{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
/* Result */
.score{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mist{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
/* Board */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right}
tr.me td{background:var(--accent-soft);font-weight:800}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.badge .medal{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;background:var(--star);color:var(--on-star)}
.badge.locked{opacity:.45}
.badge.locked .medal{background:var(--line);color:var(--muted)}
.stagestrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;text-align:center}
.stagestrip .locked{opacity:.35}
input[type=text],input[type=email],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;max-width:320px}
.notice{border-left:4px solid var(--prac);background:var(--prac-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.atomi{display:block;width:100%;height:auto;overflow:visible}
.mood-happy .bod{animation:bounce 2.4s ease-in-out infinite;transform-origin:60px 90px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.spin{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.mood-happy .bod,.spin{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Lessons */
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson .body{font-size:1.06rem;line-height:1.6;max-width:66ch}
.formula{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--cs,var(--accent-soft));border-left:5px solid var(--c,var(--accent));border-radius:10px;padding:12px 14px;font-weight:700;font-size:1.02rem;overflow-x:auto}
ul.pts,ol.pts{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;max-width:66ch;font-size:1.04rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent))}
.steps li.hidden{display:none}
.answer{border-radius:12px;background:var(--good-soft);color:var(--good);padding:10px 14px;font-weight:800}
.status{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-new{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st-read{background:var(--prac-soft);color:var(--prac)}
.st-learned{background:var(--good-soft);color:var(--good)}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nextup{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nextup:first-of-type{border-top:0}
@media (max-width:520px){.nextup{grid-template-columns:1fr auto}.nextup .subjname{grid-column:1 / -1}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:999px;background:var(--line)}
.dots i.on{background:var(--c,var(--accent))}
/* Customise Atomi */
.dress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:800;font-size:.9rem}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--star);box-shadow:var(--glow)}
.tile.trying{border-color:var(--accent);border-style:dashed}
.tile .art{width:92px}
.tile.locked .art{opacity:.6}
.tile .req{font-size:.74rem;font-weight:700;color:var(--muted);line-height:1.3}
.tile .wearing{font-size:.74rem;font-weight:800;color:var(--good)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Brand kit: Cosmic lab night sky (Daylight theme drops it) */
body{background-image:radial-gradient(2px 2px at 12% 18%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.5px 1.5px at 68% 12%,rgba(255,179,225,.6),transparent 60%),radial-gradient(2px 2px at 85% 46%,rgba(255,228,144,.6),transparent 60%),radial-gradient(1.5px 1.5px at 32% 72%,rgba(159,216,255,.55),transparent 60%),radial-gradient(1.5px 1.5px at 52% 38%,rgba(205,182,255,.6),transparent 60%),radial-gradient(2px 2px at 92% 88%,rgba(168,240,208,.5),transparent 60%),radial-gradient(1px 1px at 22% 52%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.5px 1.5px at 78% 70%,rgba(255,173,158,.5),transparent 60%);background-attachment:fixed}
:root[data-theme="light"] body{background-image:none}
.brand b{color:var(--accent)}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
@media (max-width:560px){.hero .bubble::before{display:none}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer}
.promo{display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.promo .btn{align-self:flex-start}
.s-notes{--c:var(--accent);--cs:var(--accent-soft)}
/* Notes and flashcards */
.flash{min-height:220px;border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;box-shadow:var(--glow)}
.flash.flipped{background:var(--accent-soft);border-color:var(--accent)}
.flash-text{font-family:var(--font-display);font-size:1.4rem;font-weight:600;line-height:1.35;max-width:46ch}
/* Games */
.game{display:flex;flex-direction:column;gap:10px}
.game .tag{margin-top:6px}
.match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.match-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mtile{min-height:92px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px;font-weight:800;font-size:.86rem;line-height:1.3;color:var(--ink)}
.mtile span{font-family:var(--font-display);font-size:1.6rem;color:var(--accent)}
.mtile.up{background:var(--surface);border-color:var(--accent)}
.mtile.up.def{border-color:var(--star)}
.mtile.done{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:.8}
.nuclide{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:4px;font-family:var(--font-display);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 22px}
.nuclide .nA,.nuclide .nZ{grid-column:1;font-size:1.1rem;text-align:right;color:var(--muted)}
.nuclide .nS{grid-column:2;grid-row:1 / span 2;font-size:3.4rem;font-weight:700;color:var(--ink);line-height:1}
.nuclide .nS sup{font-size:1.3rem;color:var(--chem)}
.counter{display:flex;flex-direction:column;gap:6px}
.ctr-num{font-family:var(--font-display);font-size:1.6rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.bt-board{display:flex;flex-direction:column;gap:6px}
.bt-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bt-row.me{border-color:var(--star);background:var(--accent-soft)}
.bt-rank{font-family:var(--font-display);width:1.4em;text-align:center;color:var(--muted)}
.bt-name{flex:1;font-weight:800;min-width:0;overflow-wrap:anywhere}
.bt-prog{width:120px}
.bt-score{font-family:var(--font-display);font-size:1.2rem;font-variant-numeric:tabular-nums;min-width:2.5ch;text-align:right}
.code{font-family:var(--font-display);letter-spacing:.12em;color:var(--star)}
.nav{flex-wrap:wrap}
.fcode{font-family:var(--font-display);font-size:2rem;font-weight:700;letter-spacing:.18em;color:var(--star)}
.invite{border-color:var(--star);box-shadow:var(--glow)}
.fr-row{grid-template-columns:1fr auto auto}
#fr-code::placeholder,#bt-code::placeholder{text-transform:none}

/* ---------- Arcade ---------- */
.btn-brand{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.hot{border-color:var(--star-deep);background:var(--star);color:var(--on-star);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.arc-hero{background:radial-gradient(circle at 85% 20%,var(--accent-soft),transparent 60%),var(--surface)}
.arc-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.arc-mode{display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.arc-mode:hover{transform:translateY(-3px)}
.mode-art{height:84px;border-radius:14px;display:grid;place-items:center;background:var(--panel)}
.mode-art svg{height:72px;width:auto}
.mode-rush .mode-art{background:linear-gradient(135deg,#3f3478,#5a3f7a)}
.mode-gold .mode-art{background:linear-gradient(135deg,#2f3f7a,#3f3478)}
.mode-race .mode-art{background:linear-gradient(135deg,#3f3478,#2f4f6a)}
.arc-hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.arc-score{position:relative;display:flex;align-items:baseline;gap:8px}
.arc-score b{font-family:var(--font-display);font-size:2.4rem;line-height:1;color:var(--star);font-variant-numeric:tabular-nums}
.arc-score small{font-size:1.1rem;color:var(--muted)}
.floaty{position:absolute;left:10px;top:-6px;font-family:var(--font-display);font-weight:700;font-size:1.4rem;pointer-events:none;animation:floatUp 1.1s ease-out forwards;white-space:nowrap;z-index:3;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.floaty.up{color:var(--good)} .floaty.down{color:var(--bad)}
.floaty.dmg{left:50%;top:10%;font-size:2rem;color:var(--star)}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-46px) scale(1.25)}}
.arc-main{display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start}
@media (max-width:720px){.arc-main{grid-template-columns:1fr}}
.arc-play{display:flex;flex-direction:column;gap:12px;min-width:0}
.arc-side{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.arc-p{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:10px;transition:background .2s}
.arc-p.me{background:var(--accent-soft)}
.arc-rank{font-family:var(--font-display);width:1.2em;color:var(--muted);text-align:center}
.arc-name{flex:1;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-val{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.arc-log p{background:var(--bg);border-radius:8px;padding:6px 8px;margin-top:4px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.shop-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.shop-item.pow{border-color:var(--accent)}
.pips{display:flex;gap:4px}.pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}.pips i.on{background:var(--star)}
.planets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.planet{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;transition:transform .15s}
.planet:hover:not(:disabled){transform:translateY(-4px) rotate(-2deg);border-color:var(--accent)}
.planet svg{animation:bob 2.4s ease-in-out infinite}
.planet:nth-child(2) svg{animation-delay:.4s}.planet:nth-child(3) svg{animation-delay:.8s}
.planet.open{border-color:var(--star);animation:pop .35s ease-out}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.track{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:14px;padding:10px}
.lane{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}
.lane-name{font-size:.8rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane.me .lane-name{color:var(--star)}
.lane-road{position:relative;height:28px;border-radius:999px;background:repeating-linear-gradient(90deg,var(--bg) 0 14px,var(--surface) 14px 28px)}
.rocket{position:absolute;top:2px;transition:left .5s cubic-bezier(.3,1.4,.6,1)}
.flag{position:absolute;right:4px;top:4px;width:6px;height:20px;background:repeating-linear-gradient(0deg,#f8f4ff 0 5px,#2a2150 5px 10px);border-radius:2px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:110px}
.pod-block{width:100%;border-radius:12px 12px 0 0;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;color:var(--accent)}
.pod1 .pod-block{height:96px;background:var(--star);color:var(--on-star)}.pod2 .pod-block{height:66px}.pod3 .pod-block{height:44px}
.pod.me b{color:var(--star)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{top:105%;transform:rotate(720deg) translateX(40px)}}
/* ---------- Story ---------- */
.story-promo{background:linear-gradient(120deg,var(--accent-soft),var(--surface) 70%)}
.ship-mini{width:170px;flex:none}.ship{width:100%;max-width:340px;height:auto}
@media (max-width:560px){.ship-mini{width:110px}}
.story-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.planet-card{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.planet-card.locked{opacity:.55}
.boss-mini{width:64px;flex:none}.boss-big{width:110px}
.boss-big svg,.boss-mini svg{width:100%;height:auto;display:block}
.boss-big svg{animation:bob 2s ease-in-out infinite}
.stars span{color:var(--line);font-size:1.1rem}.stars span.on{color:var(--star)}.stars.big span{font-size:2.2rem}
.talk{display:flex;gap:14px;align-items:flex-end}
.talk.boss-talk{flex-direction:row-reverse}
.talk-face{width:110px;flex:none}
.talk-bubble{flex:1;animation:pop .3s ease-out}
.talk-bubble p{margin-top:4px;font-size:1.05rem}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:radial-gradient(ellipse at 50% 90%,var(--accent-soft),transparent 70%),var(--panel);border-radius:18px;padding:14px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.vs{font-family:var(--font-display);font-size:1.6rem;color:var(--star)}
.hearts span{font-size:1.5rem;color:var(--line)}.hearts span.on{color:var(--bad)}
.hpbar{width:100%;max-width:160px;height:12px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--star));transition:width .4s}
.timer{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake,.planet svg,.boss-big svg,.chip.hot,.floaty,.talk-bubble,.planet.open{animation:none}.rocket{transition:none}}
.src{display:flex;flex-direction:column;gap:10px}
.src-topics{max-height:190px;overflow:auto;padding:2px}
.src-topics button .muted{font-weight:600;font-size:.78rem}
.nav-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--star);color:var(--on-star);font-size:.72rem;font-weight:800}
.box-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.box-card.idle{flex-direction:row;flex-wrap:wrap;text-align:left;align-items:center}
.box-art{width:120px;position:relative;flex:none}.box-art svg{width:100%;height:auto;display:block}
.box-art.dim{opacity:.45}
.box-count{position:absolute;top:0;right:0;background:var(--star);color:var(--on-star);font-family:var(--font-display);font-weight:700;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--bg)}
.wiggle svg{animation:wiggle 2.2s ease-in-out infinite}
.shaking svg{animation:shake .3s linear infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.box-prize{width:170px;animation:pop .5s ease-out}
.rar-tag{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--panel)}
.rar{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.rar-common .rar-tag,.rar.rar-common{color:var(--muted)}
.rar-rare .rar-tag,.rar.rar-rare{color:var(--phy)}
.rar-epic .rar-tag,.rar.rar-epic{color:#ffb3e1}
.rar-legendary .rar-tag,.rar.rar-legendary{color:var(--star)}
.box-card.rar-epic{box-shadow:0 0 0 2px #ffb3e1,0 0 32px rgba(255,179,225,.35)}
.box-card.rar-legendary{box-shadow:0 0 0 2px var(--star),0 0 40px rgba(255,228,144,.45)}
:root[data-theme="light"] .rar-epic .rar-tag,:root[data-theme="light"] .rar.rar-epic{color:#a3307a}
:root[data-theme="light"] .rar-legendary .rar-tag,:root[data-theme="light"] .rar.rar-legendary{color:#8a5a00}
@media (prefers-reduced-motion:reduce){.wiggle svg,.shaking svg,.box-prize{animation:none}}
</style>

<script>

/* ---------- constants ---------- */
const SUBJ = {

  {name:"Spark",xp:0},{name:"Atom",xp:500},{name:"Molecule",xp:1500},{name:"Scientist",xp:4000},{name:"Supernova",xp:10000}

  {id:"first",name:"First quiz",desc:"Finish your first quiz"},

  {id:"streak7",name:"7-day streak",desc:"Study 7 days in a row"},

  {id:"fixer",name:"Mistake fixer",desc:"Fix 10 mistakes in Review"},
  {id:"labpro",name:"Lab Pro",desc:"Reach 70% on every Practical topic"},
  {id:"learn1",name:"First lesson",desc:"Learn your first topic"},
  {id:"learn10",name:"Bookworm",desc:"Learn 10 topics"},
  {id:"learn30",name:"Scholar",desc:"Learn 30 topics"},
  {id:"notetaker",name:"Note taker",desc:"Turn your notes into flashcards"},
  {id:"gamer",name:"Game on",desc:"Play 10 science games"},
  {id:"champion",name:"Champion",desc:"Win a Quiz Battle with friends"},
  {id:"friendly",name:"Friendly",desc:"Add your first friend"}
];
const PASS = 70; // % on the lesson check needed to count a topic as learned
const QMAP = {};
TOPICS.forEach(t => t.qs.forEach((q,i) => { QMAP[t.id + "#" + i] = {t, i}; }));
const TBYID = Object.fromEntries(TOPICS.map(t => [t.id, t]));

/* ---------- small helpers ---------- */
const pad = n => String(n).padStart(2,"0");
function today(){ const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayNum(s){ const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; }
function addDays(s,n){ const d = new Date((dayNum(s)+n)*864e5); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function weekKey(){ const d = new Date(); return addDays(today(), -((d.getDay()+6)%7)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function withTimeout(p, ms){ return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
function stageOf(xp){ let s = 0; STAGES.forEach((st,i) => { if(xp >= st.xp) s = i; }); return s; }

/* ---------- state ---------- */
function fresh(){
  return {v:1,name:"",level:3,xp:0,streak:0,lastDay:null,quizzes:0,weekKey:"",weekXp:0,
    topics:{},review:{},badges:[],answered:0,correct:0,fixed:0,subjDone:{},hideBoard:false,learn:{},lastSubj:"phy",decks:[],best:{},games:0,wins:0,friends:[],friendCode:"",mute:false,savedAt:0,story:{done:{}},owned:[],boxes:1,boxXp:0,look:{theme:"classic",hat:null,band:null,scarf:null,cape:null,glasses:null}};
}
let S = fresh();
let mode = "local";          // "cloud" when saved to the artifact's database
let DB = null, UID = null;
let BOARD = [], boardState = "off", boardWriteOk = true;
let view = "loading", viewArg = null, yearFilter = "all";
let Q = null;
let LS = null; // current lesson: {id, step, shown}
let DRESS = {tab:"theme", preview:null, item:null}; // customise screen

const LKEY = () => "atomi-quiz-" + (UID || "local");
function loadLocal(){ try{ const raw = localStorage.getItem(LKEY()); if(raw) return JSON.parse(raw); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LKEY(), JSON.stringify(S)); }catch(e){} }

let saving = false, saveAgain = false;
async function save(){
  S.savedAt = Date.now();
  saveLocal();
  if(mode !== "cloud") return;
  if(saving){ saveAgain = true; return; }
  saving = true;
  try{ await DB.doc("data/users/"+UID+"/state").set(JSON.parse(JSON.stringify(S))); }
  catch(e){ console.warn("Cloud save failed", e); }
  saving = false;
  if(saveAgain){ saveAgain = false; save(); }
}

let boardSaving = false;
async function pushBoard(){
  if(mode !== "cloud" || !boardWriteOk || boardSaving) return;
  boardSaving = true;
  const ref = DB.doc("players/"+UID);
  try{
    await ref.set({name:S.name.slice(0,20), xp:S.xp, stage:stageOf(S.xp), weekKey:S.weekKey, weekXp:S.weekXp, streak:effStreak(), look:cleanLook(S.look), friendCode:ensureFriendCode(), hidden:!!S.hideBoard});
  }catch(e){
    if(e && e.code === "invalid_argument") boardWriteOk = false;
  }
  boardSaving = false;
}

/* ---------- derived values ---------- */
function tstate(id){ return S.topics[id] || (S.topics[id] = {a:[]}); }
function isOn(t){ const st = S.topics[t.id]; if(st && typeof st.off === "boolean") return !st.off; return t.y <= S.level && (S.level <= 2 || t.y >= 3); }
// Lower secondary (Y1-2) and upper secondary (Y3-4) students each see their own stage first
function stageSort(ts){ const r = t => ((t.y >= 3) === (S.level >= 3) ? 0 : 10) + t.y; return ts.slice().sort((a, b) => r(a) - r(b)); }
const YEAR_OPTS = [[1,"Year 1 science (Sec 1 / Grade 7)"],[2,"Year 2 science (Sec 2 / Grade 8)"],[3,"Year 3 science (Sec 3 / Grade 9)"],[4,"Year 4 science (Sec 4 / Grade 10)"]];
function mastery(id){ const a = (S.topics[id] && S.topics[id].a) || []; if(!a.length) return 0; return Math.round(a.reduce((x,y)=>x+y,0) / a.length * 100); }
function tried(id){ return ((S.topics[id] && S.topics[id].a) || []).length; }
function subjMastery(s){ const ts = TOPICS.filter(t => t.s === s && isOn(t)); if(!ts.length) return 0; return Math.round(ts.reduce((x,t)=>x+mastery(t.id),0) / ts.length); }
function daysSince(){ return S.lastDay ? dayNum(today()) - dayNum(S.lastDay) : null; }
function effStreak(){ const d = daysSince(); return (d === 0 || d === 1) ? S.streak : 0; }
function mood(){ const d = daysSince(); if(d === null) return "ready"; if(d === 0) return "happy"; if(d === 1) return "ready"; if(d <= 3) return "sleepy"; return "dim"; }
function dueReviews(){ const t = today(); return Object.keys(S.review).filter(k => S.review[k].due <= t && getQ(k)); }
function weakest(n){
  const on = TOPICS.filter(isOn);
  const triedT = on.filter(t => tried(t.id)).sort((a,b) => mastery(a.id) - mastery(b.id));
  const out = triedT.filter(t => mastery(t.id) < 100).slice(0,n);
  if(out.length < n) shuffle(on.filter(t => !tried(t.id))).slice(0, n - out.length).forEach(t => out.push(t));
  return out;
}
/* learning progress */
function lstatus(id){ const l = S.learn[id]; if(l && l.done) return "learned"; if(l && l.read) return "read"; return "new"; }
const STATUS_LABEL = {new:"Not started", read:"Lesson read", learned:"Learned"};
function statusChip(id){ const s = lstatus(id); return '<span class="status st-'+s+'">'+(s==="learned"?"✓ ":"")+STATUS_LABEL[s]+'</span>'; }
// Start with this year's topics, then any others that are switched on
function nextLesson(s){
  const open = t => t.s === s && isOn(t) && lstatus(t.id) !== "learned";
  return TOPICS.find(t => open(t) && t.y === S.level) || TOPICS.find(open) || null;
}
function learnedCount(s){ return TOPICS.filter(t => (!s || t.s === s) && lstatus(t.id) === "learned").length; }
function addXp(n){
  const wk = weekKey(); if(S.weekKey !== wk){ S.weekKey = wk; S.weekXp = 0; }
  S.xp += n; S.weekXp += n;
  if(n > 0){ S.boxXp = (S.boxXp || 0) + n; while(S.boxXp >= BOX_XP){ S.boxXp -= BOX_XP; S.boxes = (S.boxes || 0) + 1; } }
}
function markStudied(){
  const d = daysSince();
  if(d !== 0){ S.streak = (d === 1) ? S.streak + 1 : 1; S.lastDay = today(); }
}

/* ---------- Atomi, the mascot ---------- */
/* ---------- Atomi's wardrobe: themes and accessories from the Atomi brand sheet ---------- */
const THEMES = {

  seasonal: {body:"#e3f4ff", blush:"#ff9bb0", rings:["#7cc7ff","#b9e3ff","#e9f6ff"], dots:"#ffffff", dotShape:"snow"},
  neon:     {body:"#c79bff", blush:"#ff5ad1", rings:["#ff5ad1","#3ff5ff","#d6ff3f"], dots:"#f0e3ff"},

];
const DEFAULT_LOOK = {theme:"classic", hat:null, band:null, scarf:null, cape:null, glasses:null, face:null, outfit:null, hold:null, fx:null, bg:null};
function cleanLook(l){
  const out = Object.assign({}, DEFAULT_LOOK);
  if(!l || typeof l !== "object") return out;
  WARDROBE.forEach(g => { if(g.items.some(it => it.id === l[g.slot])) out[g.slot] = l[g.slot]; });
  if(out.hat && out.band) out.band = null;
  return out;
}
let ATOMI_UID = 0;

function atomi(stage, md, opt){
  opt = opt || {};

function atomiSays(){
  const n = dueReviews().length, st = effStreak(), md = mood();
  if(learnedCount() === 0 && S.quizzes === 0) return "Hi "+S.name+"! Let's learn your first topic together. Each lesson takes about 5 minutes.";
  if(md === "happy") return "Nice work today! "+(st > 1 ? "That's a "+st+"-day streak. " : "")+(n ? n+" mistake"+(n>1?"s are":" is")+" ready to review." : "Want to beat your score?");
  if(md === "ready") return st > 1 ? "Ready for today's quiz? Keep your "+st+"-day streak going!" : "Ready for today's quiz?";

/* ---------- quiz engine ---------- */
function makeQ(qid){
  const {t, i} = getQ(qid); const q = t.qs[i];
  const order = shuffle([0,1,2,3]);
  return {qid, t, text:q[0], opts:order.map(k => q[1+k]), ans:order.indexOf(0), expl:q[5]};
}
function poolFor(topics){ const out = []; topics.forEach(t => t.qs.forEach((_,i) => out.push(t.id+"#"+i))); return out; }
function startQuiz(kind, arg){
  let ids = [], label = "";
  if(kind === "quick"){ ids = shuffle(poolFor(TOPICS.filter(isOn))).slice(0,10); label = "Quick quiz"; }
  else if(kind === "subject"){ ids = shuffle(poolFor(TOPICS.filter(t => t.s === arg && isOn(t)))).slice(0,10); label = SUBJ[arg].name+" quiz"; }
  else if(kind === "topic"){ ids = shuffle(poolFor([TBYID[arg]])); label = TBYID[arg].name; }
  else if(kind === "check"){ ids = shuffle(poolFor([TBYID[arg]])); label = "Lesson check: " + TBYID[arg].name; }
  else if(kind === "review"){ ids = shuffle(dueReviews()).slice(0,10); label = "Review mistakes"; }
  else if(kind === "custom"){ const keep = QB; QB = {s:arg.s, topics:arg.topics || [], n:arg.n}; ids = shuffle(builderPool()).slice(0, arg.n || 10); QB = keep;
    label = arg.s === "all" ? "Mixed quiz" : arg.s === "notes" ? "My notes quiz" : SUBJ[arg.s].name + " quiz" + ((arg.topics||[]).length === 1 && TBYID[arg.topics[0]] ? ": " + TBYID[arg.topics[0]].name : ""); }
  else if(kind === "deck"){ const d = (S.decks || []).find(x => x.id === arg); if(d){ ids = shuffle(d.qs.map((_, i) => "deck:" + d.id + "#" + i)); label = d.title; } }
  if(!ids.length){ toast("There are no questions here yet. Switch on some topics first."); return; }
  Q = {kind, arg, label, list:ids.map(makeQ), i:0, picked:null, correct:0, xp:0, wrong:[], startStage:stageOf(S.xp)};
  go("quiz");
}
function answer(k){
  if(!Q || Q.picked !== null) return;
  const q = Q.list[Q.i]; Q.picked = k;
  const ok = k === q.ans;
  const ts = tstate(q.t.id); ts.a.push(ok ? 1 : 0); if(ts.a.length > 10) ts.a.shift();
  S.answered++;
  if(ok){ S.correct++; Q.correct++; Q.xp += 10; } else Q.wrong.push(q);
  const r = S.review[q.qid];
  if(!ok) S.review[q.qid] = {due:addDays(today(),1), c:0, step:0};
  else if(r){
    r.c++;
    if(r.c >= 2){ delete S.review[q.qid]; S.fixed = (S.fixed||0) + 1; }
    else { r.step = Math.min((r.step||0) + 1, 2); r.due = addDays(today(), [1,3,7][r.step]); }
  }
  render();
  const nb = document.getElementById("next"); if(nb) nb.focus();
}
function nextQ(){
  if(!Q || Q.picked === null) return;
  if(Q.i < Q.list.length - 1){ Q.i++; Q.picked = null; render(); const o = document.querySelector(".opt"); if(o) o.focus(); return; }
  finishQuiz();
}
function finishQuiz(){
  const n = Q.list.length;
  const perfect = Q.correct === n && n >= 5;
  Q.bonus = 20 + (perfect ? 50 : 0); Q.xp += Q.bonus; Q.perfect = perfect;
  Q.pct = Math.round(Q.correct / n * 100);
  Q.learnedNow = false;
  const before = unlockedSet(); Q.boxesBefore = S.boxes || 0;
  if(Q.kind === "check" || Q.kind === "topic"){
    const l = S.learn[Q.arg] || (S.learn[Q.arg] = {});
    l.best = Math.max(l.best || 0, Q.pct);
    if(Q.pct >= PASS && !l.done){ l.done = today(); Q.learnedNow = true; Q.xp += 50; }
  }
  addXp(Q.xp);
  markStudied();
  S.quizzes++;
  Q.list.forEach(q => { S.subjDone[q.t.s] = true; });
  if(perfect) S.perfects = (S.perfects||0) + 1;
  Q.newBadges = checkBadges();
  Q.newBoxes = Math.max(0, (S.boxes || 0) - (Q.boxesBefore || 0));
  Q.stageUp = stageOf(S.xp) > Q.startStage;
  save(); pushBoard();
  go("result");
}
function checkBadges(){
  const has = new Set(S.badges), got = [];
  const give = id => { if(!has.has(id)){ S.badges.push(id); has.add(id); got.push(id); } };
  if(S.quizzes >= 1) give("first");
  if(S.streak >= 3) give("streak3");
  if(S.streak >= 7) give("streak7");
  if((S.perfects||0) >= 1) give("perfect");
  if(S.correct >= 100) give("hundred");
  if(TOPICS.some(t => tried(t.id) >= 4 && mastery(t.id) >= 80)) give("master");
  if(["phy","chem","bio","prac"].every(s => S.subjDone[s])) give("allround");
  if((S.fixed||0) >= 10) give("fixer");
  if(TOPICS.filter(t => t.s === "prac").every(t => tried(t.id) >= 4 && mastery(t.id) >= 70)) give("labpro");
  const lc = learnedCount();
  if(lc >= 1) give("learn1");
  if(lc >= 10) give("learn10");
  if(lc >= 30) give("learn30");
  if((S.decks||[]).length >= 1) give("notetaker");
  if((S.games||0) >= 10) give("gamer");
  if((S.wins||0) >= 1) give("champion");
  if((S.friends||[]).length >= 1) give("friendly");
  return got;
}

const BOX_XP = 150;
const RARITY = {common:{name:"Common", w:60}, rare:{name:"Rare", w:28}, epic:{name:"Epic", w:10}, legendary:{name:"Legendary", w:2}};
function owns(slot, it){ return !it.req || (S.owned || []).includes(slot + ":" + it.id); }

function openBox(){
  if(!(S.boxes > 0) || BOX.phase === "shake") return;
  const pool = []; WARDROBE.forEach(g => g.items.forEach(it => { if(!owns(g.slot, it)) pool.push({slot:g.slot, it}); }));
  S.boxes--;
  let prize = null;
  if(pool.length){
    const avail = Object.keys(RARITY).filter(r => pool.some(p => p.it.rarity === r));
    let x = Math.random() * avail.reduce((n, r) => n + RARITY[r].w, 0), pick = avail[0];
    for(const r of avail){ x -= RARITY[r].w; if(x <= 0){ pick = r; break; } }
    const opts = pool.filter(p => p.it.rarity === pick);
    prize = opts[Math.floor(Math.random() * opts.length)];
    S.owned = (S.owned || []).concat(prize.slot + ":" + prize.it.id);
  } else addXp(50);
  save();
  BOX = {phase:"shake", prize};
  if(typeof sfx === "function") sfx("whoosh");
  render();
  setTimeout(() => { BOX.phase = "open"; if(typeof sfx === "function") sfx(prize && (prize.it.rarity === "epic" || prize.it.rarity === "legendary") ? "win" : "coin"); render(); if(prize && prize.it.rarity !== "common" && typeof confetti === "function") confetti(); }, 1300);
}

function wear(slot, id){

  const it = g.items.find(x => x.id === id); if(!it) return;

    DRESS.preview = null; DRESS.item = null; save(); pushBoard(); render();

/* ---------- lessons ---------- */
function lessonSteps(id){ return LESSONS[id].cards.length + 3; } // intro + cards + worked example + wrap-up
function openLesson(id){
  if(!LESSONS[id]) return;
  LS = {id, step:0, shown:0};
  S.lastSubj = TBYID[id].s;
  go("lesson");
}
function lessonMove(d){
  if(!LS) return;
  const n = lessonSteps(LS.id);
  LS.step = Math.max(0, Math.min(n - 1, LS.step + d));
  if(LS.step === n - 1){
    const l = S.learn[LS.id] || (S.learn[LS.id] = {});
    if(!l.read){ l.read = today(); addXp(20); markStudied(); LS.firstRead = true; save(); pushBoard(); }
  }
  render(); window.scrollTo(0,0);
  const b = document.getElementById("lnext") || document.getElementById("lcheck"); if(b) b.focus();
}

function vQuiz(){
  const q = Q.list[Q.i], n = Q.list.length, picked = Q.picked;
  let md = "ready", say = "You've got this.";
  if(picked !== null){ if(picked === q.ans){ md = "happy"; say = ["Nice one!","Correct!","Brilliant!","You know this!"][Q.i % 4]; } else { md = "sleepy"; say = "So close! Read the explanation."; } }
  let h = '<section class="card s-'+q.t.s+'" style="display:flex;flex-direction:column;gap:16px">'+
    '<div class="quizhead"><div>'+me(stageOf(S.xp), md, {goggles:q.t.s==="prac"})+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px"><div class="row between"><span class="tag">'+esc(subjName(q.t.s))+' · '+esc(q.t.name)+'</span>'+
    '<span class="small muted">Question '+(Q.i+1)+' of '+n+'</span></div>'+bar(Math.round((Q.i + (picked!==null?1:0)) / n * 100))+

    '<p class="qtext" id="qtext">'+esc(q.text)+'</p><div class="opts" role="group" aria-labelledby="qtext">';
  q.opts.forEach((o,k) => {

    h += '<button class="'+cls+'" data-act="ans" data-k="'+k+'"'+(picked!==null?' disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></button>';

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.tagName === "INPUT") return;
  const a = b.dataset.act;
  if(a === "go") go(b.dataset.v, b.dataset.arg);
  else if(a === "quiz") startQuiz(b.dataset.k, b.dataset.arg);
  else if(a === "ans") answer(Number(b.dataset.k));
  else if(a === "next") nextQ();
  else if(a === "again") startQuiz(Q.kind, Q.arg);
  else if(a === "quit") go("home");
  else if(a === "learn") openLesson(b.dataset.arg);
  else if(a === "wear") wear(b.dataset.slot, b.dataset.id);
  else if(a === "dress-tab"){ DRESS.tab = b.dataset.slot; render(); }
  else if(a === "dress-back"){ DRESS.preview = null; DRESS.item = null; render(); }
  else if(a === "box-open") openBox();
  else if(a === "install"){ if(INSTALL_PROMPT){ INSTALL_PROMPT.prompt(); INSTALL_PROMPT.userChoice.finally(() => { INSTALL_PROMPT = null; render(); }); } }
  else if(a === "logout"){ if(window.ATOMI_ACCOUNT) window.ATOMI_ACCOUNT.signOut(); }
  else if(a === "box-done"){ BOX = {phase:"idle", prize:null}; render(); }
  else if(a === "box-wear"){ const p = BOX.prize; BOX = {phase:"idle", prize:null}; if(p){ S.look = withItem(S.look, p.slot, p.it.id); DRESS.preview = null; DRESS.item = null; save(); pushBoard(); } render(); toast("Atomi is wearing it!"); }
  else if(a === "lnext") lessonMove(1);
  else if(a === "lback") lessonMove(-1);
  else if(a === "reveal"){ if(LS){ LS.shown++; render(); const r = document.querySelector('[data-act="reveal"]') || document.getElementById("lnext"); if(r) r.focus(); } }
  else if(a === "year"){ yearFilter = b.dataset.y; render(); }
});
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if(!a) return;
  if(a === "toggle"){ tstate(el.dataset.arg).off = !el.checked; save(); render(); }
  else if(a === "level"){ S.level = [1,2,3,4].includes(Number(el.value)) ? Number(el.value) : 3; TOPICS.forEach(t => { if(S.topics[t.id]) delete S.topics[t.id].off; }); save(); render(); toast("Now studying Year "+S.level+" science"); }
  else if(a === "hide"){ S.hideBoard = !el.checked; save(); pushBoard(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "onboard"){
    const nm = document.getElementById("nick").value.trim().slice(0,20);
    if(!nm){ document.getElementById("nick").focus(); return; }
    S.name = nm; S.level = [1,2,3,4].includes(Number(new FormData(e.target).get("yr"))) ? Number(new FormData(e.target).get("yr")) : 3;
    save(); pushBoard(); go("home");
  } else if(e.target.id === "nameform"){
    const nm = document.getElementById("nm").value.trim().slice(0,20);
    if(nm){ S.name = nm; save(); pushBoard(); toast("Nickname saved"); render(); }
  }
});
document.addEventListener("keydown", e => {
  if(view === "lesson" && LS && e.target.tagName !== "INPUT"){
    if(e.key === "ArrowRight" && LS.step < lessonSteps(LS.id) - 1) lessonMove(1);
    else if(e.key === "ArrowLeft" && LS.step > 0) lessonMove(-1);
    return;
  }
  if(view !== "quiz" || !Q || e.target.tagName === "INPUT") return;
  if(Q.picked === null && ["1","2","3","4"].includes(e.key)) answer(Number(e.key) - 1);
  else if(Q.picked !== null && e.key === "Enter" && e.target.id !== "next"){ e.preventDefault(); nextQ(); }
});

/* ---------- start-up ---------- */
function adopt(data){
  const base = fresh();
  if(data && typeof data === "object") Object.keys(base).forEach(k => { if(data[k] !== undefined) base[k] = data[k]; });
  if(data && data.perfects) base.perfects = data.perfects;
  if(data && data.level === undefined && data.y4) base.level = 4; // older saves
  if(![1,2,3,4].includes(base.level)) base.level = 3;
  if(data && typeof data === "object" && !Array.isArray(data.owned) && (data.xp || 0) > 0){ base.owned = legacyOwned(base); base.boxes = 1; }
  if(!Array.isArray(base.owned)) base.owned = [];
  base.boxes = Math.max(0, Math.min(999, Number(base.boxes) || 0)); base.boxXp = Math.max(0, Math.min(BOX_XP - 1, Number(base.boxXp) || 0));
  base.look = cleanLook(base.look);
  return base;
}

  render();

  if(window.ATOMI_AUTH){ try{ await window.ATOMI_AUTH; }catch(e){} }
  let user = null;
  if(window.claude && typeof window.claude.use === "function"){
    try{ [DB, user] = await Promise.all([withTimeout(window.claude.use("db"), 10000), withTimeout(window.claude.use("user"), 10000)]); }catch(e){ DB = null; }
  }
  if(window.claude && typeof window.claude.use === "function"){
    try{ [SAMPLE, ROOM] = await Promise.all([withTimeout(window.claude.use("sample"), 10000), withTimeout(window.claude.use("room"), 10000)]); }catch(e){}
    if(SAMPLE && SAMPLE.limits){ try{ const lim = await SAMPLE.limits(); SAMPLE_IMAGES = lim && lim.images ? lim.images : null; }catch(e){} }
  }
  if(DB && user){
    try{ UID = await withTimeout(user.id(), 10000); }catch(e){ UID = null; }
    if(UID){
      try{
        const snap = await withTimeout(DB.doc("data/users/"+UID+"/state").get(), 10000);
        if(snap){ mode = "cloud"; if(snap.exists){ S = adopt(snap.data()); const mine = loadLocal(); if(mine && (mine.savedAt || 0) > (S.savedAt || 0)) S = adopt(mine); } else { try{ const g = JSON.parse(localStorage.getItem("atomi-quiz-local") || "null"); if(g && g.name) S = adopt(g); }catch(e){} } }
      }catch(e){ mode = "local"; }
    }
  }
  if(mode === "local"){ UID = UID || null; S = adopt(loadLocal()); }
  if(mode === "cloud"){
    boardState = "loading";
    const timer = setTimeout(() => { if(boardState === "loading"){ boardState = "error"; if(view === "board") render(); } }, 10000);
    try{
      DB.collection("players").onSnapshot(snap => {
        clearTimeout(timer);
        BOARD = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
        boardState = "ok"; if(view === "board") render();
      }, () => { clearTimeout(timer); boardState = "error"; if(view === "board") render(); });
    }catch(e){ boardState = "error"; }
  }
  if(ROOM){ lobbyWatch(); if(mode === "cloud") ROOM.presence({nick:String(S.name||"").slice(0,20)}).catch(() => {}); }
  if(mode === "cloud") pushBoard();
  go(S.name ? "home" : "onboard");
}
boot();
</script>
</body>
</html>
